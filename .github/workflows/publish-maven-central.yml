name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      MAVEN_CENTRAL_SIGNING_KEY:
        required: true
      MAVEN_CENTRAL_SIGNING_PASSWORD:
        required: true
      GRADLE_ENCRYPTION_KEY:
        required: true

permissions:
  contents: read

jobs:
  build-native:
    name: Build native library (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            msvc_arch: amd64
          - platform: windows
            arch: aarch64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Install Rust targets
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/target/
          key: native-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build native resource
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: >-
          ./gradlew prepareNativeResources
          -PkestaraNativeTarget=${{ matrix.target }}
          -PkestaraNativeArch=${{ matrix.arch }}

      - name: Upload native resource
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/generated/native-resources/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Kestara WebRTC
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Download native resources
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-native-resources
          merge-multiple: true

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to Maven Central
        env:
          VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishToMavenCentral
          -PkestaraNativeResources=release-native-resources
          --no-configuration-cache
          --stacktrace
