[package]
name = "kestara-webrtc-native"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "Native WebRTC runtime for Kestara WebRTC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enderdash-com/kestara-webrtc"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
async-trait = "0.1.89"
bytes = "1.12.0"
crossbeam-channel = "0.5.15"
jni = "0.22.4"
rcgen = "0.14.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rtc = { git = "https://github.com/enderdash-com/rtc.git", rev = "81a8ba796d058daa07771eb9160ad411724c3cbe", features = ["pem"] }
ice = { package = "rtc-ice", git = "https://github.com/enderdash-com/rtc.git", rev = "81a8ba796d058daa07771eb9160ad411724c3cbe" }
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time"] }
webrtc = { git = "https://github.com/enderdash-com/webrtc.git", rev = "18bf3d45cb284d1b18971de757874da51e075096" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
unit_bindings = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow" # Conflicts with rustc's unreachable_pub.
suboptimal_flops = "allow"

unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
panic_in_result_fn = "warn"
unreachable = "warn"
clone_on_ref_ptr = "warn"
wildcard_enum_match_arm = "warn"
format_push_string = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
redundant_clone = "warn"

# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
significant_drop_tightening = "warn"

# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"
