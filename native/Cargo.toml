[package]
name = "alloy-webrtc-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native WebRTC runtime for Alloy WebRTC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enderdash-com/alloy-webrtc"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
