[package]
name = "kestara-webrtc-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Native WebRTC runtime for Kestara WebRTC"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enderdash-com/kestara-webrtc"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1.89"
bytes = "1.12.0"
crossbeam-channel = "0.5.15"
jni = "0.22.4"
rcgen = "0.14.9"
rtc = { version = "0.20.3", features = ["pem"] }
ice = { package = "rtc-ice", version = "0.20.3" }
tokio = { version = "1.52.0", features = ["rt-multi-thread", "time"] }
webrtc = { git = "https://github.com/enderdash-com/webrtc.git", rev = "e74661e71b8f0b1e981e7541282633a37a644202" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
